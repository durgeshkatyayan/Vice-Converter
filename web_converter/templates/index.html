<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Modal Converter</title>
    <!-- Tailwind CSS for simple, responsive design -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-xl shadow-lg max-w-md w-full p-6 space-y-6">
        <div class="text-center">
            <h1 class="text-2xl font-bold text-gray-800">Universal Converter</h1>
            <p class="text-gray-500 text-sm mt-1">Voice & Text Translation</p>
        </div>

        <!-- Input Area -->
        <div>
            <textarea id="textInput" rows="4" 
                class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500" 
                placeholder="Type here or use dictation..."></textarea>
        </div>

        <!-- Controls -->
        <div class="grid grid-cols-2 gap-4">
            <button onclick="startDictation()" class="bg-blue-100 text-blue-700 py-3 rounded-lg font-medium hover:bg-blue-200 transition">
                🎙️ Dictate (STT)
            </button>
            <button onclick="speakText()" class="bg-green-100 text-green-700 py-3 rounded-lg font-medium hover:bg-green-200 transition">
                🔊 Read (TTS)
            </button>
            <button onclick="translateText()" class="bg-purple-100 text-purple-700 py-3 rounded-lg font-medium hover:bg-purple-200 transition col-span-2">
                📝 Translate to Spanish
            </button>
            <button onclick="voiceToVoice()" class="bg-indigo-600 text-white py-4 rounded-lg font-bold hover:bg-indigo-700 transition col-span-2 shadow-md">
                🌐 Live Voice-to-Voice
            </button>
        </div>

        <!-- Status Message -->
        <p id="statusMsg" class="text-center text-sm text-gray-500 font-medium h-4"></p>
    </div>

    <script>
        const textInput = document.getElementById('textInput');
        const statusMsg = document.getElementById('statusMsg');

        function setStatus(msg) {
            statusMsg.innerText = msg;
            setTimeout(() => statusMsg.innerText = "", 3000);
        }

        // 1. Voice to Text (Dictation) using Browser API
        function startDictation(autoTranslate = false) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Your browser does not support Speech Recognition. Try Google Chrome.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            
            recognition.onstart = () => setStatus("🎙️ Listening...");
            
            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                textInput.value = transcript;
                setStatus("✅ Captured!");
                
                if (autoTranslate) {
                    translateText(true); // Proceed to translate and speak
                }
            };

            recognition.onerror = (event) => setStatus("❌ Error capturing audio.");
            recognition.start();
        }

        // 2. Text to Voice using Browser API
        function speakText(textToSpeak = null) {
            const text = textToSpeak || textInput.value;
            if (!text) return setStatus("⚠️ Nothing to read.");

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'es-ES'; // Set to Spanish accent for the translation
            window.speechSynthesis.speak(utterance);
            setStatus("🔊 Speaking...");
        }

        // 3. Text to Text (Translation) via Python Backend
        async function translateText(autoSpeak = false) {
            const text = textInput.value;
            if (!text) return setStatus("⚠️ Enter text to translate.");

            setStatus("⏳ Translating...");
            try {
                const response = await fetch('/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text, target_lang: 'es' })
                });
                const data = await response.json();
                
                if (data.translated_text) {
                    textInput.value = data.translated_text;
                    setStatus("✅ Translated!");
                    if (autoSpeak) speakText(data.translated_text);
                } else {
                    setStatus(" Translation failed.");
                }
            } catch (err) {
                setStatus(" Server error.");
            }
        }

        // 4. Voice to Voice (Chain the functions together)
        function voiceToVoice() {
            startDictation(true); // Pass 'true' to trigger auto-translate and speak
        }
    </script>
</body>
</html>
